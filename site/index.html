<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>放假年龄 · FIRE Age</title>
  <meta name="description" content="放假年龄：边算边学的财务自由、提前退休计算器。算出你几岁能开始放假，看懂每个参数，并知道怎么提前。支持跨国退休，公式和数据来源全部公开。">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>放假年龄 <span class="en">FIRE Age</span></h1>
        <p class="sub">财务自由 / 提前退休计算器，边算边学</p>
      </div>
      <div class="switches">
        <div class="seg" role="group" aria-label="计算方向">
          <button type="button" id="to-fwd">几岁能放假</button>
          <button type="button" id="to-bwd">想几岁放假</button>
        </div>
        <div class="seg" role="group" aria-label="界面详细程度">
          <button type="button" id="to-simple">简单</button>
          <button type="button" id="to-pro">专业</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="headline" aria-live="polite">
        <div id="headline"></div>
        <div class="tiles" id="tiles"></div>
        <div class="share-row"><button type="button" class="primary" id="share-btn">生成结果卡片</button></div>
        <div class="share" id="share-panel" hidden>
          <img id="share-img" alt="放假年龄结果卡片">
          <p class="fine" id="share-hint">长按图片保存，发到评论区晒一晒。</p>
          <a class="ghost save" id="share-download" download="fire-age.png">下载图片</a>
          <p class="share-comment" id="share-comment"></p>
          <div class="goal-row">
            <button type="button" class="ghost" id="share-copy">复制这句话</button>
            <span class="fine" id="share-copy-status" role="status"></span>
          </div>
        </div>
      </section>

      <section class="inputs" aria-label="输入">
        <form id="simple-form" autocomplete="off"></form>
        <form id="pro-form" autocomplete="off" hidden></form>
        <div class="estimate" id="estimate"></div>
      </section>

      <div class="results">
        <section class="card" id="solve-card" hidden>
          <h2>想按时放假，四条路任选其一</h2>
          <p class="sub">每条路只改一个数字，其余保持你填写的数值。</p>
          <div class="solves" id="solves"></div>
        </section>

        <section class="card" id="levers"></section>
        <section class="card" id="goal" hidden></section>

        <section class="card">
          <h2>资产会怎么变</h2>
          <p class="sub" id="chart-sub"></p>
          <div class="legend">
            <span><i class="sw band-wide"></i>10–90 分位</span>
            <span><i class="sw band-mid"></i>25–75 分位</span>
            <span><i class="sw line-mid"></i>中位数</span>
            <span><i class="sw line-target"></i>放假所需资产</span>
          </div>
          <div class="chart-box">
            <svg id="chart" role="img" aria-label="资产随年龄变化的分位数区间图"></svg>
            <div class="tip" id="tip" hidden></div>
          </div>
          <p class="fine" id="mc-note"></p>
          <details><summary>查看数据表</summary><div class="tbl"><table id="pct-table"></table></div></details>
        </section>

        <section class="card pro-only" hidden>
          <h2>FIRE 变体</h2>
          <p class="sub">同一份收入，不同的放假生活标准。</p>
          <div class="tbl"><table id="variants"></table></div>
        </section>

        <section class="card pro-only" hidden>
          <h2>敏感度：放假年龄</h2>
          <p class="sub">行是实际年化收益，列是每年储蓄额。颜色越深放假越早，黑框是当前输入。</p>
          <div class="tbl" id="heat-box"></div>
        </section>

        <section class="card">
          <h2>认识每个参数</h2>
          <p class="sub">点开看它是什么、对你影响多大、怎么改善。</p>
          <div id="cards"></div>
        </section>
      </div>
    </main>

    <footer>
      <p>本工具仅用于教育和测算，不构成投资建议。市场数据版本 <span id="data-version"></span>，决策前请核对官方来源。</p>
    </footer>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
